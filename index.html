<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rbl.visuals</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  background: #000;
  color: #fff;
}

/* NAV */
nav {
  position: fixed;
  width: 100%;
  padding: 15px;
  text-align: center;
  backdrop-filter: blur(10px);
}

nav a {
  color: #aaa;
  margin: 0 15px;
  text-decoration: none;
}

nav a:hover {
  color: #fff;
}

/* HERO */
.hero {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

.hero h1 {
  font-size: 4rem;
  background: linear-gradient(90deg, #ff00cc, #7b00ff, #0099ff);
  -webkit-background-clip: text;
  color: transparent;
}

.hero p {
  margin-top: 20px;
  color: #aaa;
}

/* BUTTON */
.btn {
  margin-top: 30px;
  padding: 12px 25px;
  border-radius: 30px;
  border: none;
  background: linear-gradient(90deg, #ff00cc, #7b00ff, #0099ff);
  color: white;
}

/* SECTION */
.section {
  padding: 100px 20px;
  text-align: center;
}

/* GALLERY */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
}

.gallery img {
  width: 100%;
  height: 300px;
  object-fit: cover;
  transition: 0.4s;
}

.gallery img:hover {
  transform: scale(1.05);
}

/* FOOTER */
footer {
  padding: 40px;
  text-align: center;
  color: #666;
}
</style>

</head>

<body>

<nav>
  <a href="#">Home</a>
  <a href="#work">Work</a>
  <a href="#contact">Contact</a>
</nav>

<section class="hero">
  <h1>rbl.visuals</h1>
  <p>Capturing emotion through light</p>
  
  <a href="#work">
    <button class="btn">View Work</button>
  </a>
</section>

<section id="work" class="section">
  <h2>My Work</h2>
  
  <div class="gallery">
    <img src="images/D5209F52-25AB-44FF-983B-47EDD532463C.jpg" alt="Photo RBL Visuals">
    <img src="https://photos.app.goo.gl/yADRYa8yZvLmUAoX7">
    <img src="https://photos.app.goo.gl/88igc2hGNTcDuJC88">
    <img src="https://photos.app.goo.gl/LHbbRPHNas75oJLu8">
  </div>
</section>

<section id="contact" class="section">
  <h2>Let’s Work Together</h2>
  <p>Bookings & collaborations</p>

  <a href="https://instagram.com/rbl.visuals" target="_blank">
    <button class="btn">DM on Instagram</button>
  </a>
</section>

<footer>
  © 2026 rbl.visuals
</footer>

</body>
</html>
